<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#344D7A"/><stop offset="0.6" stop-color="#2A3E62"/><stop offset="1" stop-color="#1E2D4A"/>
    </linearGradient>
    <pattern id="twill" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <rect width="14" height="7" fill="rgba(255,255,255,0.045)"/>
    </pattern>
    <radialGradient id="void" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#000"/><stop offset="0.7" stop-color="#070A16"/><stop offset="1" stop-color="#18213A"/>
    </radialGradient>
    <linearGradient id="worm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2A9AE"/><stop offset="1" stop-color="#DE8790"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#twill)"/>
  <!-- pocket seams -->
  <g fill="none" stroke="#D9A04A" stroke-width="13" stroke-linecap="round" stroke-dasharray="30 22">
    <path d="M206 300 H 818"/>
    <path d="M226 300 V 640 Q 226 720 512 830 Q 798 720 798 640 V 300"/>
    <path d="M262 300 V 628 Q 262 694 512 790 Q 762 694 762 628 V 300" opacity="0.75"/>
  </g>
  <!-- the hole -->
  <ellipse cx="512" cy="620" rx="150" ry="78" fill="rgba(150,175,215,0.3)"/>
  <ellipse cx="512" cy="620" rx="124" ry="64" fill="url(#void)"/>
  <g stroke="#E6EAF3" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <path d="M390 610 l-26 -6"/><path d="M398 640 l-24 12"/><path d="M630 604 l28 -8"/><path d="M628 640 l26 14"/><path d="M460 562 l-6 -22"/><path d="M560 564 l8 -22"/><path d="M500 684 l-4 20"/><path d="M548 682 l8 18"/>
  </g>
  <!-- the worm, crawling out -->
  <path d="M512 640 C 512 520 470 470 430 430 C 380 380 420 300 500 310 C 560 318 600 360 650 330" fill="none" stroke="rgba(0,0,10,0.35)" stroke-width="96" stroke-linecap="round" transform="translate(10 18)"/>
  <path d="M512 640 C 512 520 470 470 430 430 C 380 380 420 300 500 310 C 560 318 600 360 650 330" fill="none" stroke="url(#worm)" stroke-width="96" stroke-linecap="round"/>
  <path d="M440 448 C 418 420 410 392 420 370" fill="none" stroke="#D27880" stroke-width="100" stroke-linecap="butt" opacity="0.9"/>
  <path d="M498 600 C 494 520 456 476 420 438 C 384 398 404 330 492 330 C 548 334 592 370 640 344" fill="none" stroke="#FBD5D3" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
  <!-- face -->
  <circle cx="666" cy="300" r="20" fill="#FFFDF8"/><circle cx="672" cy="300" r="11" fill="#1E1418"/>
  <circle cx="630" cy="296" r="20" fill="#FFFDF8"/><circle cx="636" cy="296" r="11" fill="#1E1418"/>
  <ellipse cx="616" cy="344" rx="20" ry="13" fill="rgba(232,72,92,0.45)"/>
  <path d="M664 342 q 14 10 28 -4" fill="none" stroke="#4A1C26" stroke-width="7" stroke-linecap="round"/>
  <!-- rivets -->
  <circle cx="226" cy="300" r="24" fill="#B87A45"/><circle cx="226" cy="300" r="12" fill="#E3B07D"/>
  <circle cx="798" cy="300" r="24" fill="#B87A45"/><circle cx="798" cy="300" r="12" fill="#E3B07D"/>
</svg>
